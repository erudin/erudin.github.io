<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Linktree</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    /* ==== Reset ==== */
    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
      padding: 2rem 1.5rem;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
    }

    p.bio {
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 1.5rem;
    }

    .links a {
      display: block;
      text-decoration: none;
      background: #0066ff;
      color: #fff;
      padding: 0.85rem;
      margin: 0.5rem 0;
      border-radius: 8px;
      font-weight: 500;
      transition: background .2s, transform .1s;
    }

    .links a:hover,
    .links a:focus {
      background: #0052cc;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #888;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Optional avatar -->
    <img src="https://via.placeholder.com/96" alt="Your photo" class="avatar">

    <h1>Your Name</h1>
    <p class="bio">Creator • Designer • Blogger</p>

    <div class="links">
      <a href="https://twitter.com/yourhandle" target="_blank">Twitter</a>
      <a href="https://github.com/yourhandle" target="_blank">GitHub</a>
      <a href="https://www.linkedin.com/in/yourhandle" target="_blank">LinkedIn</a>
      <a href="https://yourwebsite.com" target="_blank">Portfolio</a>
      <a href="mailto:you@example.com">Email Me</a>
    </div>

    <div class="footer">
      © 2025 Your Name – All rights reserved
    </div>
  </div>
</body>
</html>
